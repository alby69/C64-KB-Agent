[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c64-kb-agent"
version = "1.0.0"
description = "C64 Knowledge Base Agent — validazione, indicizzazione FTS5, API REST e gestione dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25",
]
serve = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pip-audit>=2.0",
]

[project.scripts]
c64-kb-agent = "c64_kb_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["c64_kb_agent*", "cleaners*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "data/sources",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=c64_kb_agent --cov-report=term-missing --cov-fail-under=80"
