[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c64-kb-agent"
version = "0.1.0"
description = "C64-KB-Agent — Knowledge base centralizzata: validazione contratti, indicizzazione FTS5 e gestione dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "jsonschema>=4.0.0"]
serve = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]

[project.scripts]
c64-kb-agent = "main:main"

[tool.setuptools]
packages = ["cleaners"]
py-modules = ["main", "kbvalidate"]
