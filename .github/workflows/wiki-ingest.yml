name: Wiki Automated Ingest

on:
  push:
    paths:
      - 'data/docs/**'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit total docs to migrate'
        required: false
        type: string
      sources:
        description: 'Space-separated sources to migrate (e.g. c64ref sta_c64_org)'
        required: false
        type: string

jobs:
  wiki-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Wiki Ingest & Linker
        run: |
          LIMIT_FLAG="${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}"
          SOURCES_FLAG="${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }}"
          python scripts/migrate_wiki.py $LIMIT_FLAG $SOURCES_FLAG
          c64-kb-agent wiki link
          c64-kb-agent wiki synthesize
          c64-kb-agent wiki rebuild-index

      - name: Git pull rebase
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Commit & Push updated wiki
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(wiki): automated ingest and wiki compilation update"
          file_pattern: "data/wiki/*"
