name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff check and format
        run: |
          ruff check .
          ruff format --check .

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,serve,dev]"
      - name: Run mypy
        run: |
          mypy c64_kb_agent tests/test_api.py tests/test_cli.py tests/test_config.py tests/test_quality.py tests/test_search.py tests/test_validators.py scripts/generate_manifest.py

  security:
    name: Security Scan (Bandit & Pip Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,serve,dev]"
      - name: Run Bandit
        run: |
          bandit -r c64_kb_agent -s B101,B104,B110,B112
      - name: Run Pip Audit
        run: |
          pip-audit --ignore-code GHSA-c38f-5x8q-v6j8 --ignore-code GHSA-6x32-v48g-cmvw

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,serve]"

      - name: Run unit tests with coverage
        run: |
          pytest -v --cov=c64_kb_agent --cov-report=xml --cov-fail-under=80

  contract-gate:
    name: Contract Validation Gate
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,serve]"

      - name: Validate dataset contract and manifest
        run: |
          c64-kb-agent validate
          python scripts/generate_manifest.py
