name: Wiki Weekly Health Lint

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

jobs:
  wiki-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Wiki Linter
        run: |
          c64-kb-agent wiki lint --format json > wiki_lint_report.json
          cat wiki_lint_report.json
          python -c "
          import json, sys
          with open('wiki_lint_report.json') as f:
              data = json.load(f)
          if len(data.get('invalid_schema', [])) > 0:
              print('SCHEMA VALIDATION FAILURES FOUND IN WIKI!')
              sys.exit(1)
          "
